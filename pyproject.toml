[project]
name = "evaling"
version = "0.1.0"
description = "Compare prompt variants and models from the command line"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Amro Mousa" }]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]
keywords = ["llm", "eval", "evaluation", "prompt", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
evaling = "evaling.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.28",
]

[dependency-groups]
dev = [
    "mcp>=1.28",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaling"]

[tool.hatch.build.targets.wheel.force-include]
"src/evaling/py.typed" = "evaling/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end or scale tests (deselect with -m 'not slow')",
    "perf: timing and memory guards (CI runs these alone, without coverage)",
]

[tool.coverage.run]
source = ["evaling"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Preview is on solely for PLW1514; nothing else from preview is selected.
preview = true
explicit-preview-rules = true
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "PLW1514", # text I/O must name its encoding (cp1252 defaults break Windows)
]

# Mutation testing: change the source, see whether a test notices. Scoped to
# the modules that encode invariants, because that is where a test which
# passes with its subject deleted does real damage. `uv run mutmut run`, then
# `uv run mutmut results`. See CONTRIBUTING.md.
[tool.mutmut]
source_paths = ["src/evaling/"]
only_mutate = [
    "*/evaling/privacy.py",
    "*/evaling/secrets.py",
    "*/evaling/reqlog.py",
    "*/evaling/scoring.py",
    "*/evaling/textfile.py",
]
# Only the tests that can kill mutants in those modules. Narrower than the
# suite on purpose: mutmut resolves its own relative paths inside each test,
# so any test that changes directory breaks the run — and a smaller selection
# is much faster. The cost is that a mutant another test would have killed
# reports as survived, so triage the list rather than trusting it.
pytest_add_cli_args_test_selection = [
    "tests/test_no_look.py",
    "tests/test_hostile_content.py",
    "tests/test_credential_leaks.py",
    "tests/test_secrets.py",
    "tests/test_reqlog.py",
    "tests/test_scoring.py",
    "tests/test_scale.py",
    "tests/test_sampling.py",
    "tests/test_config_fuzz.py",
    "tests/test_loader.py",
    "tests/test_cases.py",
    "tests/test_doctor.py",
]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
