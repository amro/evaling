name: CI

# Documentation-only changes go to docs.yml instead, which runs the same
# checks on one runner rather than nine. The docs are tested — ruff formats
# Python inside markdown fences, and test_docs validates every YAML example
# against the real schema — so they get a build, just a proportionate one.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv export --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt

  # The lockfile pins one `mcp`, but the published extra allows a range, so a
  # user resolves whatever is newest. mcp 2.1 replaced every tool error message
  # with a bare "Error executing tool <name>" and shipped to users unnoticed —
  # CI was green the whole time, because CI only ever ran the pinned version.
  # This job runs the MCP tests against the newest mcp the extra permits.
  mcp-latest:
    runs-on: ubuntu-latest
    continue-on-error: true # a broken upstream release is news, not our red build
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: MCP tests against the newest permitted mcp
        # --upgrade-package is load-bearing: without it uv reuses the locked
        # mcp and this job silently re-tests the version CI already covers.
        run: |
          uv run --isolated --upgrade-package mcp --with-editable . \
            --with 'mcp<3' --with pytest --with pytest-cov \
            python -c 'from importlib.metadata import version; print("mcp under test:", version("mcp"))'
          uv run --isolated --upgrade-package mcp --with-editable . \
            --with 'mcp<3' --with pytest --with pytest-cov \
            python -m pytest tests/test_mcp_server.py tests/test_mcp_streaming.py \
              tests/test_source_privacy.py tests/test_surface_parity.py -q

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One Windows and one macOS job. Windows is not decorative: it has
          # already caught a real encoding bug that every POSIX job passed.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      # Perf guards run in their own job: coverage instrumentation dominates
      # the timings, and a shared runner under a full matrix is the worst
      # place to measure anything.
      - run: uv run pytest -m "not perf" --cov=evaling --cov-report=term-missing

  perf:
    # Memory and throughput regression guards. One job, one OS, no coverage —
    # a number measured under instrumentation is a number about the
    # instrumentation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      # --durations so the numbers are in the log: these guards are loose by
      # design, and without visible timings drift is only noticed when one
      # finally trips.
      - run: uv run pytest -m perf --durations=0
