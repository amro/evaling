name: macOS

# macOS on a schedule rather than on every push.
#
# It bills at 10x, which made one macOS job roughly 85% of the cost of running
# CI on a push — while disagreeing with the Linux jobs almost never. The real
# platform risk in this project is Windows (path separators, encodings, no
# SIGPIPE), and that stays per-push at 2x.
#
# Weekly, not daily. A schedule is a fixed cost whether or not anything was
# committed, and at 10x this one is the largest recurring line in the budget:
# daily would be ~360 billable minutes a month, 12% of the whole allowance,
# for a platform that has yet to disagree with Linux about anything. Weekly is
# ~48.
#
# The trade is latency — a macOS-specific break is found within a week rather
# than within a day. That is acceptable because nothing here is macOS-shaped:
# the platform risk this project actually has is Windows, which stays
# per-change.
#
# workflow_dispatch is the answer for the case that matters. Run this from the
# Actions tab before a release, against the exact commit you are publishing.
on:
  schedule:
    # Sunday, ahead of the Monday mutation run so a weekend of work is
    # covered before the week starts.
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest -m "not perf"
