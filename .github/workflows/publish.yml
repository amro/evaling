name: Publish

# Publishes to PyPI when a GitHub Release is published.
#
# Actions here are pinned to commit SHAs, not tags. A tag is a mutable ref: the
# owner of an action — or anyone who takes over their account — can move it to
# different code, which this workflow would then run holding an OIDC token that
# can publish as evaling. That has happened to popular actions before. The
# comment after each SHA is the human-readable ref it came from, and Dependabot
# updates SHA pins the same way it updates tags.
#
# The other workflows stay on tags on purpose: they hold no credentials and
# cannot publish, so the same compromise costs a red build rather than a
# malicious release.
#
# Trusted publishing (OIDC), not an API token: PyPI verifies the request came
# from this repository and this workflow, so there is no long-lived credential
# to store, rotate, or leak. The `pypi` environment must exist and must match
# the publisher configured on PyPI.
#
# Triggered by the release rather than the tag, so pushing a tag by accident
# does not publish. Publishing is irreversible — a version number on PyPI can
# be yanked but never reused.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token trusted publishing exchanges
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # The tag is the thing a human typed; the version is the thing that gets
      # published. Disagreement between them means the wrong artifact ships
      # under the right name, which is not recoverable after upload.
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv run python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - run: uv build

      # Catches a malformed README before PyPI rejects the upload, and proves
      # the metadata renders on the project page.
      - run: uvx twine check dist/*

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
